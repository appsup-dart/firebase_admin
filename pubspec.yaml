name: firebase_admin
description: A port of the Firebase admin sdk to pure, idiomatic Dart code
version: 0.4.0
homepage: https://github.com/appsup-dart/firebase_admin
repository: https://github.com/appsup-dart/firebase_admin

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  clock: ^1.1.0
  x509: ^0.2.2
  jose: ^0.3.5+1
  dotenv: ^4.0.0
  openid_client: ^0.4.3
  firebase_dart: '>=1.0.10 <3.0.0'
  path: ^1.8.0
  meta: ^1.4.0
  http: ">=0.13.0 <2.0.0"
  crypto_keys: ^0.3.0
  collection: ^1.15.0
  crypto: ^3.0.0
  firebaseapis: ">=0.1.2 <0.3.0"
  snapshot: ^0.2.5
  _discoveryapis_commons: ^1.0.4
  googleapis: ^19.0.0
  googleapis_beta: ^9.0.0

dev_dependencies:
  test: ^1.17.8
  fake_async: ^1.2.0
  lints: ^6.0.0
  mockito: ^5.0.10
  melos: ^7.0.0

melos:
  useRootAsPackage: true

  ide:
    intellij: false

  command:
    version:
      linkToCommits: true
      workspaceChangelog: false

  scripts:
    preversion: 
      exec: dart test -j 1  

false_secrets:
 - /lib/src/testing.dart 
